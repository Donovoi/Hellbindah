name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Validate task JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path('tasks/tasks.json').read_text(encoding='utf-8'))
          assert data['project'] == 'Hellbindah'
          assert data['tasks']
          required = {'id','title','status','assigned_to','area','sprint','start_date','due_date','specific','measurable','achievable','relevant','time_bound','dependencies'}
          for task in data['tasks']:
              missing = required - set(task)
              assert not missing, f"{task.get('id','unknown')} missing {missing}"
              assert task['status'] in {'Todo','Doing','Done'}
      - name: Run evaluator sample
        run: python evolution/evaluator.py samples/eval_pass.json
