name: SMART Task
about: Create or update a Hellbindah SMART task
labels: smart-task
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      placeholder: FLIGHT-001
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Todo
        - Doing
        - Done
    validations:
      required: true
  - type: input
    id: assigned_agent
    attributes:
      label: Assigned virtual agent
      placeholder: FLIGHT-01
    validations:
      required: true
  - type: textarea
    id: smart
    attributes:
      label: SMART definition
      description: Specific, measurable, achievable, relevant, and time-bound description.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
    validations:
      required: true
